<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kollektion | Luksus Parfumer</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body>
<header class="site-header"><a class="brand" th:href="@{/}"><span>♔</span>LUKSUS PARFUMER</a><nav><a th:href="@{/}">Forside</a><a th:href="@{/cart}">Kurv</a></nav></header>
<main class="page-shell"><section class="page-intro"><p class="eyebrow">KOLLEKTIONEN</p><h1>Find din næste signaturduft.</h1><p>Søg efter duft, mærkereference eller filtrér efter herre, kvinde og unisex.</p></section>
<form class="catalog-toolbar" method="get" th:action="@{/catalog}"><input type="search" name="q" th:value="${query}" placeholder="Søg fx Sauvage, Tom Ford eller Aventus"><select name="gender"><option value="">Alle</option><option value="MEN" th:selected="${selectedGender != null and selectedGender.name() == 'MEN'}">Herrer</option><option value="WOMEN" th:selected="${selectedGender != null and selectedGender.name() == 'WOMEN'}">Kvinder</option><option value="UNISEX" th:selected="${selectedGender != null and selectedGender.name() == 'UNISEX'}">Unisex</option></select><button class="button button-primary" type="submit">Filtrér</button></form>
<div class="product-grid" th:if="${!perfumes.isEmpty()}"><article class="product-card" th:each="perfume : ${perfumes}"><a th:href="@{'/perfumer/' + ${perfume.slug}}" class="product-visual"><div class="perfume-placeholder"><span th:text="${perfume.perfumeNumber}">001</span><strong th:text="${perfume.name}">Duft</strong></div></a><div class="product-card-body"><p class="product-brand" th:text="${perfume.brand}">Brand</p><h3><a th:href="@{'/perfumer/' + ${perfume.slug}}" th:text="${perfume.name}">Parfume</a></h3><p th:text="${perfume.gender.displayName}">Unisex</p><div class="size-pills"><span th:each="size : ${perfume.sizes}" th:text="${size.ml + ' ml'}">30 ml</span></div><p class="muted" th:if="${perfume.sizes.?[sellingPrice != null].isEmpty()}">Pris fastsættes i administrationen</p></div></article></div>
<div class="empty-state" th:if="${perfumes.isEmpty()}"><h2>Ingen dufte matchede din søgning.</h2><a th:href="@{/catalog}">Nulstil filtre</a></div></main></body></html>
