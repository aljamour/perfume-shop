<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Luksus Parfumer</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body>
<header class="site-header"><a class="brand" th:href="@{/}"><span>♔</span>LUKSUS PARFUMER</a></header>
<main class="page-shell checkout-grid"><section><p class="eyebrow">CHECKOUT</p><h1>Leveringsoplysninger</h1><form class="lux-form" method="post" th:action="@{/checkout}" th:object="${checkoutForm}"><div class="form-grid"><label>Fornavn<input th:field="*{firstName}"></label><label>Efternavn<input th:field="*{lastName}"></label></div><label>E-mail<input type="email" th:field="*{email}"></label><label>Telefon<input th:field="*{phone}"></label><label>Adresse<input th:field="*{address}"></label><div class="form-grid"><label>Postnummer<input th:field="*{postalCode}"></label><label>By<input th:field="*{city}"></label></div><div class="form-errors" th:if="${#fields.hasAnyErrors()}"><p>Kontrollér venligst de markerede oplysninger.</p></div><div class="payment-note"><strong>Betaling</strong><p>Første version opretter ordren uden live betalingsgateway. Betaling kan integreres senere uden at ændre ordremodellen.</p></div><button class="button button-primary" type="submit">Opret ordre</button></form></section>
<aside class="order-summary"><h2>Din ordre</h2><div th:each="line : ${lines}" class="summary-line"><span th:text="${line.perfumeName + ' · ' + line.ml + ' ml × ' + line.quantity}"></span><strong th:text="${#numbers.formatDecimal(line.lineTotal, 1, 2) + ' kr.'}"></strong></div><div class="cart-total"><span>Total</span><strong th:text="${#numbers.formatDecimal(total, 1, 2) + ' kr.'}"></strong></div></aside></main></body></html>
