<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | Perfume Shop</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body class="admin-body">
<header class="admin-header"><a class="brand" th:href="@{/admin}">♔ ADMIN</a><div><a th:href="@{/}" target="_blank">View shop</a><form method="post" th:action="@{/logout}"><button class="text-button">Log out</button></form></div></header>
<main class="admin-shell"><div class="admin-title"><div><p class="eyebrow">CONTROL CENTER</p><h1>Perfume shop</h1></div><a class="button button-primary" th:href="@{/admin/perfumes/new}">+ Add perfume</a></div>
<section class="stat-grid"><article><small>Products</small><strong th:text="${productCount}">0</strong></article><article><small>Active</small><strong th:text="${activeCount}">0</strong></article><article><small>Orders</small><strong th:text="${orderCount}">0</strong></article></section>
<section class="admin-panel"><div class="panel-heading"><h2>Products</h2><p>Prices and stock are always database-managed here.</p></div><div class="table-wrap"><table><thead><tr><th>No.</th><th>Perfume</th><th>Gender</th><th>Sizes</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="perfume : ${perfumes}"><td th:text="${perfume.perfumeNumber}"></td><td><strong th:text="${perfume.name}"></strong><small th:text="${perfume.brand}"></small></td><td th:text="${perfume.gender}"></td><td><span th:each="size : ${perfume.sizes}" class="mini-pill" th:text="${size.ml + 'ml'}"></span></td><td><span class="status" th:classappend="${perfume.active} ? ' status-on' : ''" th:text="${perfume.active ? 'Active' : 'Inactive'}"></span></td><td><a th:href="@{'/admin/perfumes/' + ${perfume.id} + '/edit'}">Edit →</a></td></tr></tbody></table></div></section>
<section class="admin-panel"><div class="panel-heading"><h2>Recent orders</h2></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Status</th><th>Total</th><th>Date</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${'#' + order.id}"></td><td th:text="${order.firstName + ' ' + order.lastName}"></td><td th:text="${order.status}"></td><td th:text="${order.total + ' kr.'}"></td><td th:text="${order.createdAt}"></td></tr></tbody></table></div></section></main></body></html>
