<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit perfume</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body class="admin-body">
<header class="admin-header"><a class="brand" th:href="@{/admin}">← ADMIN</a><a th:href="@{/}" target="_blank">View shop</a></header>
<main class="admin-shell"><div class="admin-title"><div><p class="eyebrow">PRODUCT</p><h1 th:text="${perfume.id == null ? 'New perfume' : 'Edit ' + perfume.name}"></h1></div></div>
<form class="admin-panel lux-form" method="post" th:action="@{/admin/perfumes/save}"><input type="hidden" name="id" th:value="${perfume.id}"><div class="form-grid"><label>Perfume number<input name="perfumeNumber" th:value="${perfume.perfumeNumber}" required></label><label>Name<input name="name" th:value="${perfume.name}" required></label></div><div class="form-grid"><label>Brand / original house<input name="brand" th:value="${perfume.brand}"></label><label>Gender<select name="gender"><option th:each="g : ${genders}" th:value="${g}" th:text="${g}" th:selected="${perfume.gender == g}"></option></select></label></div><label>Inspired by<input name="inspiredBy" th:value="${perfume.inspiredBy}"></label><label>Slug<input name="slug" th:value="${perfume.slug}" placeholder="e.g. baccarat-rouge-540" required></label><label>Short description<textarea name="shortDescription" rows="2" th:text="${perfume.shortDescription}"></textarea></label><label>Description<textarea name="description" rows="4" th:text="${perfume.description}"></textarea></label><label>Image URL<input name="imageUrl" th:value="${perfume.imageUrl}"></label><div class="check-row"><label><input type="checkbox" name="active" value="true" th:checked="${perfume.active}"> Active</label><label><input type="checkbox" name="featured" value="true" th:checked="${perfume.featured}"> Featured</label></div><button class="button button-primary" type="submit">Save product</button></form>
<section class="admin-panel" th:if="${perfume.id != null}"><div class="panel-heading"><h2>Sizes, prices & stock</h2><p>Nothing here is hardcoded. Each price is stored for this specific size.</p></div>
<article class="admin-size-row" th:each="size : ${perfume.sizes}"><div><strong th:text="${size.ml + ' ml'}"></strong><small th:text="${size.type}"></small></div><form method="post" th:action="@{'/admin/sizes/' + ${size.id}}" class="inline-size-form"><input type="hidden" name="perfumeId" th:value="${perfume.id}"><label>Price DKK<input type="number" step="0.01" min="0" name="sellingPrice" th:value="${size.sellingPrice}"></label><label>Stock<input type="number" min="0" name="stockQuantity" th:value="${size.stockQuantity}"></label><label class="inline-check"><input type="checkbox" name="active" value="true" th:checked="${size.active}"> Active</label><button class="button button-dark" type="submit">Update</button></form></article>
<form method="post" th:action="@{'/admin/perfumes/' + ${perfume.id} + '/sizes'}" class="add-size-form"><label>Add size (ml)<input type="number" min="1" name="ml" required></label><button class="button button-dark" type="submit">Add size</button></form></section></main></body></html>
