<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kurv | Luksus Parfumer</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body>
<header class="site-header"><a class="brand" th:href="@{/}"><span>♔</span>LUKSUS PARFUMER</a><nav><a th:href="@{/catalog}">Fortsæt shopping</a></nav></header>
<main class="page-shell narrow"><section class="page-intro"><p class="eyebrow">DIN KURV</p><h1>Udvalgte dufte.</h1></section>
<div class="empty-state" th:if="${lines.isEmpty()}"><h2>Din kurv er tom.</h2><a class="button button-primary" th:href="@{/catalog}">Se kollektionen</a></div>
<div th:unless="${lines.isEmpty()}"><article class="cart-line" th:each="line : ${lines}"><div><a th:href="@{'/perfumer/' + ${line.slug}}" th:text="${line.perfumeName}">Parfume</a><small th:text="${line.ml + ' ml'}">30 ml</small></div><form method="post" th:action="@{/cart/update}"><input type="hidden" name="sizeId" th:value="${line.sizeId}"><input class="qty" type="number" name="quantity" min="0" th:value="${line.quantity}"><button>Opdatér</button></form><strong th:text="${#numbers.formatDecimal(line.lineTotal, 1, 2) + ' kr.'}">0</strong><form method="post" th:action="@{/cart/remove}"><input type="hidden" name="sizeId" th:value="${line.sizeId}"><button class="text-button">Fjern</button></form></article>
<div class="cart-total"><span>Total</span><strong th:text="${#numbers.formatDecimal(total, 1, 2) + ' kr.'}">0</strong></div><a class="button button-primary checkout-button" th:href="@{/checkout}">Gå til checkout</a></div></main></body></html>
