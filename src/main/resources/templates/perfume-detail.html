<!doctype html><html lang="da" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${perfume.name + ' | Luksus Parfumer'}">Parfume</title><link rel="stylesheet" th:href="@{/css/site.css}"></head><body>
<header class="site-header"><a class="brand" th:href="@{/}"><span>♔</span>LUKSUS PARFUMER</a><nav><a th:href="@{/catalog}">Kollektion</a><a th:href="@{/cart}">Kurv</a></nav></header>
<main class="page-shell"><section class="detail-layout"><div class="detail-visual"><div class="detail-bottle"><span th:text="${perfume.perfumeNumber}">001</span><strong th:text="${perfume.name}">Duft</strong><small>EXTRAIT DE PARFUM</small></div></div><div class="detail-copy">
<p class="eyebrow" th:text="${perfume.brand}">BRAND</p><h1 th:text="${perfume.name}">Parfume</h1><p class="detail-meta"><span th:text="${perfume.gender.displayName}">Unisex</span> · <span th:text="${'Nr. ' + perfume.perfumeNumber}">Nr.</span></p><p class="lead" th:text="${perfume.shortDescription}">Beskrivelse</p><p class="muted" th:text="${perfume.description}">Lang beskrivelse</p>
<div class="notes"><div><small>TOPNOTER</small><p><span th:each="note,iter : ${perfume.scentNotes.?[noteType.name() == 'TOP']}" th:text="${note.noteName + (!iter.last ? ', ' : '')}"></span></p></div><div><small>HJERTENOTER</small><p><span th:each="note,iter : ${perfume.scentNotes.?[noteType.name() == 'HEART']}" th:text="${note.noteName + (!iter.last ? ', ' : '')}"></span></p></div><div><small>BASENOTER</small><p><span th:each="note,iter : ${perfume.scentNotes.?[noteType.name() == 'BASE']}" th:text="${note.noteName + (!iter.last ? ', ' : '')}"></span></p></div></div>
<div class="buy-box"><h2>Vælg størrelse</h2><div th:if="${perfume.sizes.?[sellingPrice != null and stockQuantity > 0 and active].isEmpty()}" class="price-pending">Denne duft er oprettet i kataloget, men pris/lager er endnu ikke aktiveret af administratoren.</div>
<form th:each="size : ${perfume.sizes}" th:if="${size.sellingPrice != null and size.stockQuantity > 0 and size.active}" method="post" th:action="@{/cart/add}" class="size-buy-row"><input type="hidden" name="sizeId" th:value="${size.id}"><div><strong th:text="${size.ml + ' ml'}">30 ml</strong><small th:text="${size.type}">Extrait</small></div><span class="price" th:text="${#numbers.formatDecimal(size.sellingPrice, 1, 2) + ' kr.'}">0 kr.</span><button class="button button-primary" type="submit">Tilføj til kurv</button></form></div>
</div></section></main></body></html>
